<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuropulse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
<div class="container-fluid h-100">
    <!-- Header -->
    <div class="row header-row">
        <div class="col-4">
            <button onclick="window.location='guide.html'" class="ButtonHome w-50 mt-0" data-key="guide">GUIDE</button>
            <button onclick="window.location='settings.html'" class="ButtonHome w-50 d-block mt-2" data-key="settings">PARAMETRES</button>
        </div>
        <div class="col-4 text-center">
            <h1 class="title fw-bold text-white mt-5">NEUROPULSE</h1>
        </div>
        <div class="col-4 text-end d-flex flex-column align-items-end gap-2">
            <!-- Non connecté -->
            <button id="navRegister" onclick="window.location='register.html'" class="ButtonHome w-50 mt-0" data-key="register">INSCRIPTION</button>
            <button id="navLogin" onclick="window.location='login.html'" class="ButtonHome w-50 mt-0" data-key="login">CONNEXION</button>
            <!-- Connecté -->
            <button id="navLogout" class="ButtonHome w-50 mt-0" style="display:none;" data-key="logout">🔓 DÉCONNEXION</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="row main-content">
        <div id="gameContainer" class="col-12 d-flex justify-content-center align-items-center"></div>

        <!-- Section non connecté -->
        <div id="notConnectedSection" class="col-8 text-center">
            <p class="hero-tagline" data-key="welcome_unconnected">Hey jeune hacker, venez commencer une nouvelle partie ou connectez vous pour continuer votre aventure.</p>
        </div>

        <!-- Section connecté -->
        <div id="connectedSection" class="col-8 text-center" style="display: none;">
            <p class="hero-welcome-name" id="welcomeUsername"></p>
            <p class="hero-tagline" data-key="hero_tagline_connected">Votre aventure vous attend. Bonne chance, hacker.</p>
        </div>
    </div>

    <!-- Footer -->
    <div class="row footer-row">
        <div class="col-12 text-center">
            <button onclick="window.location='character_save.html'" class="btn ButtonHome btn-lg w-25">
                <span data-key="play">JOUER</span>
            </button>
        </div>
        <div class="col-12 text-center mt-3">
            <small class="text-white" data-key="copyright">Made by N.SILLAIRE, A.VIVIEN, O.LAADRAOUI</small>
        </div>
    </div>
</div>

<script src="../js_client/phaser.js"></script>
<script src="../js_client/main.js"></script>
<script src="../js_client/session.js"></script>
<script>
(async () => {
    const me = await getMe();
    updateNav(me ? me.username : null);

    if (me) {
        document.getElementById('notConnectedSection').style.display = 'none';
        document.getElementById('connectedSection').style.display = 'block';
        document.getElementById('welcomeUsername').textContent = `Bienvenue, ${me.username} !`;
    }
})();

if (localStorage.getItem('autoPlay') === 'true') {
    localStorage.removeItem('autoPlay');
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('startButton').click();
    });
}
</script>
<script src="../js_client/traduction.js"></script>
<script src="../js_client/script_language.js"></script>
</body>
</html>
