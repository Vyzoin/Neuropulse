<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un personnage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>

<div class="position-fixed top-0 start-0 p-3" style="z-index: 1000;">
    <button onclick="window.location='index.html'" class="ButtonHome mt-0">Menu d'accueil</button>
</div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card w-100" style="max-width: 450px;">
        <div class="card-body p-5">
            <h1 class="card-title text-center mb-4">Créer un personnage</h1>
            <form>
                <div class="mb-3">
                    <input type="text" id="firstname" class="form-control" placeholder="Prénom du personnage" required>
                </div>

                <div class="mb-3">
                    <input type="text" id="lastname" class="form-control" placeholder="Nom du personnage" required>
                </div>

                <div class="mb-3">
                    <label for="SexSelect" class="form-label">Sexe du personnage</label>
                    <select id="SexSelect" class="form-select" required>
                        <option value="">-- Sélectionnez une option --</option>
                        <option value="male">Masculin</option>
                        <option value="female">Féminin</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">Sauvegarder le personnage</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcVqwB08s2jKFEV0NuE"
        crossorigin="anonymous"></script>
</body>

</html>
