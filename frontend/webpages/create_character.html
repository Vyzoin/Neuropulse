<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un personnage - Neuropulse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>

    <div class="position-fixed top-0 start-0 p-3" style="z-index: 1000;">
        <button onclick="window.location='character_save.html'" class="ButtonHome mt-0">Retour aux
            sauvegardes</button>
    </div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card w-100" style="max-width: 550px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h1 class="card-title"
                        style="background: linear-gradient(180deg, #e9f2ff 0%, #b19aff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2rem;">
                        CRÉER UN PERSONNAGE
                    </h1>
                    <p class="small mt-2" style="color: #d0d8e8;">Configurez votre identité dans le réseau</p>
                </div>

                <form>

                    <div class="cyber-divider mb-4"></div>

                    <!-- Prénom -->
                    <div class="mb-3">
                        <label for="firstname" class="form-label">
                            <span style="color: #b19aff;">►</span> Prénom du personnage
                        </label>
                        <input type="text" id="firstname" class="form-control" placeholder="Ex: Neo, Trinity, Cipher..."
                            required>
                        <small class="text-white-50 d-block mt-1">Votre nom de code dans le réseau</small>
                    </div>

                    <!-- Nom -->
                    <div class="mb-3">
                        <label for="lastname" class="form-label">
                            <span style="color: #b19aff;">►</span> Nom du personnage
                        </label>
                        <input type="text" id="lastname" class="form-control"
                            placeholder="Ex: Anderson, Smith, Morpheus..." required>
                        <small class="text-white-50 d-block mt-1">Votre identité officielle</small>
                    </div>

                    <!-- Sexe -->
                    <div class="mb-4">
                        <label for="SexSelect" class="form-label">
                            <span style="color: #b19aff;">►</span> Sexe du personnage
                        </label>
                        <select id="SexSelect" class="form-select" required>
                            <option value="">-- Sélectionnez une option --</option>
                            <option value="male">♂ Masculin</option>
                            <option value="female">♀ Féminin</option>
                            <option value="other">⚧ Autre</option>
                        </select>
                    </div>

                    <div class="cyber-divider mb-4"></div>

                    <!-- Boutons -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="ButtonHome w-100 mt-0">
                            ✅ Créer le personnage
                        </button>
                        <button type="button" onclick="window.location='character_save.html'" class="btn btn-secondary">
                            ❌ Annuler
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js_client/traduction.js"></script>
    <script src="../js_client/script_language.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcVqwB08s2jKFEV0NuE"
        crossorigin="anonymous"></script>

</body>

</html>
