<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="mx-5">
        <h1>Créer un personnage</h1>
        <button onclick="window.location='character_save.html'" class="ButtonHome w-50">Menu d'accueil</button>
        <form action="">
            <label for="firstname"></label>
            <input type="text" id="firstname" class="form-control" placeholder="Prénom du personnage">
            <label for="lastname"></label>
            <input type="text" id="lastname" class="form-control" placeholder="Nom du personnage">
            <label for="SexSelect" class="form-label mt-3">Sexe du personnage</label>
            <select id="SexSelect" class="form-select">
                <option value="male">Masculin</option>
                <option value="female">Féminin</option>
            </select>
            <button type="submit" class="btn btn-primary">Sauvegarder le nouveau personnage</button>
        </form>
    </div>
</body>

</html>
