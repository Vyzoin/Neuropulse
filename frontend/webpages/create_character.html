<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un personnage - Neuropulse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<div class="position-fixed top-0 start-0 p-3" style="z-index: 1000;">
    <button onclick="window.location='character_save.html'" class="ButtonHome mt-0">Retour aux sauvegardes</button>
</div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card w-100" style="max-width: 550px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h1 class="card-title"
                    style="background: linear-gradient(180deg, #e9f2ff 0%, #b19aff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2rem;">
                    CRÉER UN PERSONNAGE
                </h1>
                <p class="small mt-2" style="color: #d0d8e8;">Configurez votre identité dans le réseau</p>
                <p class="small mt-1 text-info" id="slotInfo"></p>
            </div>

            <form id="createForm">
                <div class="cyber-divider mb-4"></div>

                <div class="mb-3">
                    <label for="firstname" class="form-label">
                        <span style="color: #b19aff;">►</span> Prénom du personnage
                    </label>
                    <input type="text" id="firstname" class="form-control" placeholder="Ex: Neo, Trinity, Cipher..." required>
                </div>

                <div class="mb-3">
                    <label for="lastname" class="form-label">
                        <span style="color: #b19aff;">►</span> Nom du personnage
                    </label>
                    <input type="text" id="lastname" class="form-control" placeholder="Ex: Anderson, Smith, Morpheus..." required>
                </div>

                <div class="mb-4">
                    <label for="SexSelect" class="form-label">
                        <span style="color: #b19aff;">►</span> Sexe du personnage
                    </label>
                    <select id="SexSelect" class="form-select" required>
                        <option value="">-- Sélectionnez une option --</option>
                        <option value="Masculin">♂ Masculin</option>
                        <option value="Feminin">♀ Féminin</option>
                        <option value="Autre">⚧ Autre</option>
                    </select>
                </div>

                <div class="cyber-divider mb-4"></div>

                <p id="createMsg" class="text-danger text-center mb-2"></p>

                <div class="d-grid gap-2">
                    <button type="submit" class="ButtonHome w-100 mt-0">✅ Créer le personnage</button>
                    <button type="button" onclick="window.location='character_save.html'" class="btn btn-secondary">❌ Annuler</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    const slot = parseInt(localStorage.getItem('selectedSlot')) || 1;
    document.getElementById('slotInfo').textContent = `Création dans le SLOT ${slot}`;

    document.getElementById('createForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const firstname = document.getElementById('firstname').value.trim();
        const name = document.getElementById('lastname').value.trim();
        const sexe = document.getElementById('SexSelect').value;
        const msg = document.getElementById('createMsg');

        if (!firstname || !name || !sexe) {
            msg.textContent = 'Veuillez remplir tous les champs';
            return;
        }

        try {
            const res = await fetch('http://localhost:3000/api/player', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ name, firstname, sexe, slot })
            });

            const data = await res.json();

            if (data.success) {
                localStorage.removeItem('selectedSlot');
                msg.style.color = '#4ade80';
                msg.textContent = '✅ Personnage créé avec succès !';
                setTimeout(() => window.location.href = 'character_save.html', 1000);
            } else {
                msg.style.color = '#f87171';
                msg.textContent = data.message;
            }
        } catch (err) {
            msg.style.color = '#f87171';
            msg.textContent = 'Impossible de contacter le serveur';
            console.error(err);
        }
    });
</script>
</body>
</html>
