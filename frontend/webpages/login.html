<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<div class="position-fixed top-0 start-0 p-3" style="z-index: 1000;">
    <button onclick="window.location='index.html'" class="ButtonHome mt-0" data-key="home">Menu d'accueil</button>
</div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card w-100 bg-white" style="max-width: 450px;--bs-bg-opacity: .8;">
        <div class="card-body p-5">
            <h1 class="title fw-bold text-center mb-0" data-key="login_title">Connectez-vous</h1>
            <form action="">
                <div class="mb-0">
                    <label for="user" class="form-label fw-bold mt-2" data-key="email_label">Adresse Email</label>
                    <input type="email" class="form-control" id="user" data-placeholder="email_placeholder_login" placeholder="Entrez votre adresse email ici">
                </div>
                <div class="mb-3 mt-0">
                    <label for="password" class="form-label fw-bold mt-2" data-key="password_label">Mot de passe</label>
                    <input type="password" class="form-control" id="password"
                           data-placeholder="password_placeholder_login" placeholder="Entrez votre mot de passe ici">
                </div>
                <p id="loginMsg" class="text-danger text-center mb-2"></p>
                <div class="text-center">
                    <button type="button" id="loginBtn" class="ButtonHome w-100 mt-0" data-key="login_button">Se connecter</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('user').value.trim();
        const password = document.getElementById('password').value;
        const msg = document.getElementById('loginMsg');

        if (!email || !password) {
            msg.textContent = 'Veuillez remplir tous les champs';
            return;
        }

        try {
            const res = await fetch('http://localhost:3000/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (data.success) {
                localStorage.setItem('token', data.token); 
                window.location.href = 'index.html';
            } else {
                msg.textContent = data.message;
            }
        } catch (err) {
            msg.textContent = 'Impossible de contacter le serveur';
            console.error(err);
        }
    });
</script>

<script src="../js_client/traduction.js"></script>
<script src="../js_client/script_language.js"></script>
</body>
</html>
