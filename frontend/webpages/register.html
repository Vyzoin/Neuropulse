<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S'enregistrer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="container-flex text-center pb-5 ">
        <button onclick="window.location='index.html'" class="ButtonHome w-50">Menu d'accueil</button>
     </div>
     <div class ="container pt-5">
        <form action="">
            <div class="mb-3">
                <label for="user" class="form-label pb-2 px-3 text-white fw-bold">Adresse Email</label>
                <input type="email" class="form-control" id="user" aria-describedby="emailHelp" placeholder="exemple@neuropulse.com">
            </div>
            <div class="mb-3">
                <label for="username" class="form-label pb-2 px-3 text-white fw-bold">Pseudo souhaité</label>
                <input type="text" id="username" class="form-control" placeholder="NeuropulseForEver">
            </div>
            <div class="mb-3">
                <label for="pass" class="form-label pb-2 px-3 text-white fw-bold">Mot de passe</label>
                <input type="password" class="form-control" id="password"placeholder="Mot de passe sécurisé ">
            </div>
            <div class="mb-3">
                <label for="confirmPass" class="form-label pb-2 px-3 text-white fw-bold">Confirmer le mot de passe</label>
                <input type="password" class="form-control" id="confirmpassword"placeholder="Confirmer votre mot de passe sécurisé">
            </div>
            <div class="container text-center p-5">
                <button type="submit" class="btn btn-primary w-25">S'enregistrer</button>
            </div>
        </form>
    </div>
</body>

</html>
