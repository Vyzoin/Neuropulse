<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S'inscrire</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<div class="position-fixed top-0 start-0 p-3" style="z-index: 1000;">
    <button onclick="window.location='index.html'" class="ButtonHome mt-0" data-key="home">Menu d'accueil</button>
</div>

<div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="w-100 card p-3 bg-white" style="max-width: 500px; --bs-bg-opacity: .8;">
        <h1 class="title fw-bold text-center mb-0" data-key="register_title">Inscrivez-vous</h1>
        <div class="container pt-5">
            <form action="">
                <div class="mb-3">
                    <label for="user" class="form-label pb-2 fw-bold" data-key="email_label">Adresse Email</label>
                    <input type="email" class="form-control" id="user" data-placeholder="email_placeholder_register" placeholder="Entrez votre adresse mail ici">
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold" data-key="username_label">Pseudo</label>
                    <input type="text" id="username" class="form-control" data-placeholder="username_placeholder" placeholder="Entrez votre pseudo ici">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold" data-key="password_label">Mot de passe</label>
                    <input type="password" class="form-control" id="password" data-placeholder="password_placeholder_login" placeholder="Entrez votre mot de passe ici">
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label fw-bold" data-key="confirm_password_label">Confirmer le mot de passe</label>
                    <input type="password" class="form-control" id="confirmPassword" data-placeholder="confirm_password_placeholder" placeholder="Confirmer votre mot de passe ici">
                </div>
                <p id="registerMsg" class="text-danger text-center mb-2"></p>
                <div class="text-center">
                    <button type="button" id="registerBtn" class="ButtonHome w-100 mt-0" data-key="register_button">S'enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="../js_client/session.js"></script>
<script>
// Si déjà connecté on redirige direct
(async () => {
    const me = await getMe();
    if (me) window.location.href = 'character_save.html';
})();

document.getElementById('registerBtn').addEventListener('click', async () => {
    const email = document.getElementById('user').value.trim();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const msg = document.getElementById('registerMsg');

    if (!email || !username || !password || !confirm) {
        msg.textContent = 'Veuillez remplir tous les champs';
        return;
    }

    if (password !== confirm) {
        msg.textContent = 'Les mots de passe ne correspondent pas';
        return;
    }

    try {
        const res = await fetch('http://localhost:3000/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, username, password })
        });

        const data = await res.json();

        if (data.success) {
            localStorage.setItem('token', data.token); // stocke le token
            window.location.href = 'create_character.html';
        } else {
            msg.style.color = '#f87171';
            msg.textContent = data.message;
        }
    } catch (err) {
        msg.style.color = '#f87171';
        msg.textContent = 'Impossible de contacter le serveur';
        console.error(err);
    }
});
</script>

<script src="../js_client/traduction.js"></script>
<script src="../js_client/script_language.js"></script>
</body>
</html>
