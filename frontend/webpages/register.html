<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
<!-- Bouton Menu d'accueil en haut à gauche -->
<div class="position-fixed top-0 start-0 p-3" style="z-index: 1000;">
    <button onclick="window.location='index.html'" class="ButtonHome mt-0">Menu d'accueil</button>
</div>

<!-- Formulaire centré -->
<div class="d-flex justify-content-center align-items-center " style="min-height: 100vh;">
    <div class="w-100 card p-3 bg-white" style="max-width: 500px; --bs-bg-opacity: .8;">
        <h1 class="title fw-bold text-center mb-0">INSCRIVEZ-VOUS</h1>
        <div class="container pt-5">
            <form action="">
                <div class="mb-3">
                    <label for="user" class="form-label pb-2 fw-bold">Adresse Email</label>
                    <input type="email" class="form-control" id="user" aria-describedby="emailHelp"
                           placeholder="Entrez votre adresse mail ici">
                </div>
                <div class="mb-3">
                    <!-- NE PAS OUBLIER DE VERIFIER SI LE PSEUDO EXISTE DEJA AVANT DE L'ENREGISTRER ET DE PREVOIR UNE ERREUR -->
                    <label for="username" class="form-label fw-bold">Pseudo</label>
                    <input type="text" id="username" class="form-control" placeholder="Entrez votre pseudo ici">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Mot de passe</label>
                    <input type="password" class="form-control" id="password"
                           placeholder="Entrez votre mot de passe ici">
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label fw-bold">Confirmer le mot de passe</label>
                    <input type="password" class="form-control" id="confirmPassword"
                           placeholder="Confirmer votre mot de passe ici">
                </div>
                <div class="text-center">
                    <button type="submit" class="ButtonHome w-100 mt-0">S'enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>

</html>
