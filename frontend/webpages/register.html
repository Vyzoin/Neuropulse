<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S'enregistrer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="mx-5">
        <button onclick="window.location='index.html'" class="ButtonHome w-50">Menu d'accueil</button>
        <form action="">
            <div class="mb-3">
                <label for="user" class="form-label">Adresse Email</label>
                <input type="email" class="form-control" id="user" aria-describedby="emailHelp">
            </div>
            <div>
                <label for="username">Pseudo souhaité</label>
                <input type="text" id="username" class="form-control">
            </div>
            <div class="mb-3">
                <label for="pass" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password">
            </div>
            <div class="mb-3">
                <label for="confirmPass" class="form-label">Confirmer le mot de passe</label>
                <input type="password" class="form-control" id="confirmpassword">
            </div>
            <button type="submit" class="btn btn-primary">S'enregistrer</button>
        </form>
    </div>
</body>

</html>
