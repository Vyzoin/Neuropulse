<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>

<div class="position-fixed top-0 start-0 p-3" style="z-index: 1000;">
    <button onclick="window.location='index.html'" class="ButtonHome mt-0">Menu d'accueil</button>
</div>

<div class="container d-flex align-items-center card bg-white mt-5 w-50" style="--bs-bg-opacity: .8;">
    <div class="card-title">
        <h1 class="mt-4 text-center mb-4">Paramètres</h1>
        <p>Ici, vous pouvez ajuster vos paramètres de jeu selon vos préférences.</p>
    </div>
    <div class="p-3 w-100">
        <div class="mb-3 d-flex align-items-center">
            <label for="volumeControl" class="form-label mb-0 text-nowrap">Volume du jeu</label>
            <input type="range" class="form-range ms-auto" id="volumeControl" min="0" max="100" value="50"
                   style="width: 150px;">
        </div>
        <div class="mb-3 d-flex align-items-center">
            <label for="languageSelect" class="form-label mb-0 text-nowrap">Langue du jeu</label>
            <select id="languageSelect" class="form-select ms-auto w-25" required>
                <option value="french">Français</option>
                <option value="english">English</option>
            </select>
        </div>
        <div>
            <label class="form-label mb-0 text-nowrap h3 mb-3">Contrôles</label>
            <div class="d-flex flex-column">
                <div class="d-flex align-items-center mb-2">
                    <span class="text-nowrap">Déplacer vers la gauche</span>
                    <input type="text" class="form-control w-25 text-center ms-auto" id="moveLeftControl" value="Q">
                </div>
                <div class="d-flex align-items-center mb-2">
                    <span class="text-nowrap">Déplacer vers la droite</span>
                    <input type="text" class="form-control w-25 text-center ms-auto" id="moveRightControl" value="D">
                </div>
                <div class="d-flex align-items-center mb-2">
                    <span class="text-nowrap">Déplacer vers le haut</span>
                    <input type="text" class="form-control w-25 text-center ms-auto" id="moveUpControl" value="Z">
                </div>
                <div class="d-flex align-items-center mb-2">
                    <span class="text-nowrap">Déplacer vers le bas</span>
                    <input type="text" class="form-control w-25 text-center ms-auto" id="moveDownControl" value="S">
                </div>
                <div class="d-flex align-items-center mb-2">
                    <span>Attaquer</span>
                    <input type="text" class="form-control w-25 text-center ms-auto" id="attackControl" value="Left Click">
                </div>
                <div class="d-flex align-items-center mb-2">
                    <span>Interagir</span>
                    <input type="text" class="form-control w-25 text-center ms-auto" id="Interact" value="E">
                </div>
            </div>

        </div>

</body>

</html>
