<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sauvegardes - Neuropulse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="container-fluid">
        <div class="position-fixed top-0 start-0 p-3 top-nav">
            <button onclick="window.location='index.html'" class="ButtonHome mt-0" data-key="home">Menu d'accueil</button>
        </div>

        <div class="text-center mt-5 pt-4 mb-4">
            <h1 class="page-title" style="font-size: 2.5rem; letter-spacing: 4px;">
                <span data-key="save_title">CHOIX DE LA SAUVEGARDE</span>
            </h1>
            <p class="text-white mt-2" data-key="save_subtitle">Sélectionnez un slot pour commencer votre aventure</p>
        </div>

        <div class="row g-4 px-4 mb-5">
            <!-- Première sauvegarde -->
            <div class="col-lg-4 col-md-6">
                <div class="save-slot h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2>
                            <span class="page-title">
                                <span data-key="save_slot">SLOT</span> 1
                            </span>
                        </h2>
                        <span class="badge bg-success" data-key="save_available">DISPONIBLE</span>
                    </div>

                    <div class="cyber-divider mb-3"></div>

                    <div class="mb-3 p-3 save-preview">
                        <p class="text-center text-white-50 m-0">
                            <span class="save-icon-empty">⚡</span><br>
                            <span data-key="save_empty">Emplacement vide</span>
                        </p>
                    </div>

                    <div class="d-grid gap-2">
                        <button onclick="window.location='create_character.html'" class="btn btn-primary" data-key="save_create">
                            ➕ Créer un nouveau personnage
                        </button>
                        <button class="btn btn-secondary" disabled>
                            <span data-key="save_edit">✏️ Modifier le personnage</span>
                        </button>
                        <button class="ButtonHome w-100" disabled>
                            <span data-key="save_play">▶️ JOUER</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Deuxième sauvegarde -->
            <div class="col-lg-4 col-md-6">
                <div class="save-slot h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2>
                            <span class="page-title">
                                <span data-key="save_slot">SLOT</span> 2
                            </span>
                        </h2>
                        <span class="badge bg-success" data-key="save_available">DISPONIBLE</span>
                    </div>

                    <div class="cyber-divider mb-3"></div>

                    <div class="mb-3 p-3 save-preview">
                        <p class="text-center text-white-50 m-0">
                            <span class="save-icon-empty">⚡</span><br>
                            <span data-key="save_empty">Emplacement vide</span>
                        </p>
                    </div>

                    <div class="d-grid gap-2">
                        <button onclick="window.location='create_character.html'" class="btn btn-primary" data-key="save_create">
                            ➕ Créer un nouveau personnage
                        </button>
                        <button class="btn btn-secondary" disabled>
                            <span data-key="save_edit">✏️ Modifier le personnage</span>
                        </button>
                        <button class="ButtonHome w-100" disabled>
                            <span data-key="save_play">▶️ JOUER</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Troisième sauvegarde -->
            <div class="col-lg-4 col-md-6">
                <div class="save-slot h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2>
                            <span class="page-title">
                                <span data-key="save_slot">SLOT</span> 3
                            </span>
                        </h2>
                        <span class="badge bg-success" data-key="save_available">DISPONIBLE</span>
                    </div>

                    <div class="cyber-divider mb-3"></div>

                    <div class="mb-3 p-3 save-preview">
                        <p class="text-center text-white-50 m-0">
                            <span class="save-icon-empty">⚡</span><br>
                            <span data-key="save_empty">Emplacement vide</span>
                        </p>
                    </div>

                    <div class="d-grid gap-2">
                        <button onclick="window.location='create_character.html'" class="btn btn-primary" data-key="save_create">
                            ➕ Créer un nouveau personnage
                        </button>
                        <button class="btn btn-secondary" onclick="window.location='edit_character.html'" disabled>
                            <span data-key="save_edit">✏️ Modifier le personnage</span>
                        </button>
                        <button class="ButtonHome w-100" disabled>
                            <span data-key="save_play">▶️ JOUER</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bouton temporaire pour le développement -->
        <div class="text-center mb-5 pb-4">
            <div class="alert mx-auto alert-neon-strong" style="max-width: 600px;">
                <strong data-key="development_mode">🛠️ Mode développement</strong>
                <p class="mb-2 mt-2 small" data-key="development_access">Accès rapide au jeu sans sauvegarde</p>
                <button id="startButton" class="ButtonHome w-100">
                    <span data-key="development_launch">⚡ LANCER LE JEU (TEMPORAIRE)</span>
                </button>
            </div>
        </div>
    </div>

    <script src="../js_client/traduction.js"></script>
    <script src="../js_client/script_language.js"></script>
    <script src="../js_client/phaser.js"></script>
    <script src="../js_client/main.js"></script>

</body>

</html>
