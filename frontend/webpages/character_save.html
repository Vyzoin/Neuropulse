<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sauvegardes - Neuropulse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<div class="container-fluid">
    <div class="position-fixed top-0 start-0 p-3" style="z-index: 1000;">
        <button onclick="window.location='index.html'" class="ButtonHome mt-0">Menu d'accueil</button>
    </div>

    <div class="text-center mt-5 pt-4 mb-4">
        <h1 style="background: linear-gradient(180deg, #e9f2ff 0%, #b19aff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.5rem; letter-spacing: 4px;">
            CHOIX DE LA SAUVEGARDE
        </h1>
        <p class="text-white mt-2">Sélectionnez un slot pour commencer votre aventure</p>
    </div>

    <div class="row g-4 px-4 mb-5">
        <div class="col-lg-4 col-md-6">
            <div class="save-slot h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2><span style="background: linear-gradient(180deg, #e9f2ff 0%, #b19aff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SLOT 1</span></h2>
                    <span id="badge-slot-1" class="badge bg-success">DISPONIBLE</span>
                </div>
                <div class="cyber-divider mb-3"></div>
                <div id="content-slot-1" class="mb-3 p-3" style="background: rgba(140, 50, 220, 0.1); border-radius: 8px; min-height: 120px;"></div>
                <div class="d-grid gap-2">
                    <button id="create-slot-1" onclick="selectSlot(1)" class="btn btn-primary">Créer un nouveau personnage</button>
                    <button id="edit-slot-1" onclick="editCharacter(1)" class="btn btn-secondary" disabled style="opacity: 0.5;">Modifier le personnage</button>
                    <button id="play-slot-1" class="ButtonHome w-100" disabled style="opacity: 0.5;">JOUER</button>
                </div>
            </div>
        </div>

        <div class="col-lg-4 col-md-6">
            <div class="save-slot h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2><span style="background: linear-gradient(180deg, #e9f2ff 0%, #b19aff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SLOT 2</span></h2>
                    <span id="badge-slot-2" class="badge bg-success">DISPONIBLE</span>
                </div>
                <div class="cyber-divider mb-3"></div>
                <div id="content-slot-2" class="mb-3 p-3" style="background: rgba(140, 50, 220, 0.1); border-radius: 8px; min-height: 120px;"></div>
                <div class="d-grid gap-2">
                    <button id="create-slot-2" onclick="selectSlot(2)" class="btn btn-primary">Créer un nouveau personnage</button>
                    <button id="edit-slot-2" onclick="editCharacter(2)" class="btn btn-secondary" disabled style="opacity: 0.5;">Modifier le personnage</button>
                    <button id="play-slot-2" class="ButtonHome w-100" disabled style="opacity: 0.5;">JOUER</button>
                </div>
            </div>
        </div>

        <div class="col-lg-4 col-md-6">
            <div class="save-slot h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2><span style="background: linear-gradient(180deg, #e9f2ff 0%, #b19aff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SLOT 3</span></h2>
                    <span id="badge-slot-3" class="badge bg-success">DISPONIBLE</span>
                </div>
                <div class="cyber-divider mb-3"></div>
                <div id="content-slot-3" class="mb-3 p-3" style="background: rgba(140, 50, 220, 0.1); border-radius: 8px; min-height: 120px;"></div>
                <div class="d-grid gap-2">
                    <button id="create-slot-3" onclick="selectSlot(3)" class="btn btn-primary">Créer un nouveau personnage</button>
                    <button id="edit-slot-3" onclick="editCharacter(3)" class="btn btn-secondary" disabled style="opacity: 0.5;">Modifier le personnage</button>
                    <button id="play-slot-3" class="ButtonHome w-100" disabled style="opacity: 0.5;">JOUER</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    function selectSlot(slot) {
        localStorage.setItem('selectedSlot', slot);
        window.location.href = 'create_character.html';
    }

    function editCharacter(slot) {
        localStorage.setItem('selectedSlot', slot);
        window.location.href = 'edit_character.html';
    }

    function emptyHtml() {
        return `
            <p class="text-center text-white-50 m-0">
                <span style="font-size: 3rem; opacity: 0.3;">👤</span><br>
                Emplacement vide
            </p>
        `;
    }

    function renderEmpty(slot) {
        document.getElementById(`badge-slot-${slot}`).textContent = 'DISPONIBLE';
        document.getElementById(`badge-slot-${slot}`).className = 'badge bg-success';
        document.getElementById(`content-slot-${slot}`).innerHTML = emptyHtml();
        document.getElementById(`create-slot-${slot}`).disabled = false;
        document.getElementById(`create-slot-${slot}`).style.opacity = '1';
        document.getElementById(`edit-slot-${slot}`).disabled = true;
        document.getElementById(`edit-slot-${slot}`).style.opacity = '0.5';
    }

    function renderPlayer(slot, player) {
        document.getElementById(`badge-slot-${slot}`).textContent = 'OCCUPÉ';
        document.getElementById(`badge-slot-${slot}`).className = 'badge bg-warning text-dark';
        document.getElementById(`content-slot-${slot}`).innerHTML = `
            <div class="text-center text-white">
                <div style="font-size: 3rem;">👤</div>
                <strong>${player.firstname} ${player.name}</strong>
                <div class="small mt-1">${player.sexe}</div>
            </div>
        `;
        document.getElementById(`create-slot-${slot}`).disabled = true;
        document.getElementById(`create-slot-${slot}`).style.opacity = '0.5';
        document.getElementById(`edit-slot-${slot}`).disabled = false;
        document.getElementById(`edit-slot-${slot}`).style.opacity = '1';
    }

    async function loadPlayers() {
        try {
            renderEmpty(1);
            renderEmpty(2);
            renderEmpty(3);

            const res = await fetch('http://localhost:3000/api/player/me', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            const data = await res.json();

            if (data.success && Array.isArray(data.players)) {
                data.players.forEach(player => {
                    if (player.slot >= 1 && player.slot <= 3) {
                        renderPlayer(player.slot, player);
                    }
                });
            }
        } catch (err) {
            console.error(err);
        }
    }

    loadPlayers();
</script>
</body>
</html>
