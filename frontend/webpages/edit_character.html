<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le personnage - Neuropulse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<div class="position-fixed top-0 start-0 p-3" style="z-index: 1000;">
    <button onclick="window.location='character_save.html'" class="ButtonHome mt-0">Retour aux sauvegardes</button>
</div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card w-100" style="max-width: 600px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h1 style="background: linear-gradient(180deg, #e9f2ff 0%, #b19aff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2rem;">
                    MODIFIER LE PERSONNAGE
                </h1>
                <p class="small mt-2" style="color: #d0d8e8;">Mettez à jour votre identité numérique</p>
                <p id="slotInfo" class="small mt-1 text-info"></p>
            </div>

            <div class="cyber-divider mb-4"></div>

            <div class="alert mb-4" style="background: rgba(140, 50, 220, 0.15); border: 1px solid rgba(140, 50, 220, 0.4); color: #e9f2ff;">
                <div class="row align-items-center">
                    <div class="col-auto">
                        <div style="font-size: 3rem;">👤</div>
                    </div>
                    <div class="col">
                        <strong id="currentCharacterLabel">Personnage actuel</strong>
                        <div class="small mt-1">
                            <span style="color: #b19aff;">Modification du slot sélectionné</span>
                        </div>
                    </div>
                </div>
            </div>

            <form id="editForm">
                <div class="cyber-divider mb-4"></div>

                <div class="mb-3">
                    <label for="firstname" class="form-label">
                        <span style="color: #b19aff;">►</span> Prénom du personnage
                    </label>
                    <input type="text" id="firstname" class="form-control" placeholder="Prénom du personnage">
                </div>

                <div class="mb-3">
                    <label for="lastname" class="form-label">
                        <span style="color: #b19aff;">►</span> Nom du personnage
                    </label>
                    <input type="text" id="lastname" class="form-control" placeholder="Nom du personnage">
                </div>

                <div class="mb-4">
                    <label for="SexSelect" class="form-label">
                        <span style="color: #b19aff;">►</span> Sexe du personnage
                    </label>
                    <select id="SexSelect" class="form-select">
                        <option value="Masculin">♂ Masculin</option>
                        <option value="Feminin">♀ Féminin</option>
                        <option value="Autre">⚧ Autre</option>
                    </select>
                </div>

                <div class="cyber-divider mb-4"></div>

                <div class="alert mb-4" style="background: rgba(220, 50, 50, 0.1); border: 1px solid rgba(220, 50, 50, 0.3); color: #ffb3b3;">
                    <strong>⚠️ Attention :</strong> La modification du personnage ne modifie que les informations cosmétiques.
                </div>

                <p id="saveMsg" class="text-center mb-3"></p>

                <div class="d-grid gap-2">
                    <button type="submit" class="ButtonHome w-100 mt-0">💾 Sauvegarder les modifications</button>
                    <button type="button" onclick="window.location='character_save.html'" class="btn btn-secondary">❌ Annuler</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDelete()">🗑️ Supprimer ce personnage</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    const selectedSlot = parseInt(localStorage.getItem('selectedSlot')) || 1;
    let currentPlayerId = null;

    if (!token) {
        window.location.href = 'login.html';
    }

    document.getElementById('slotInfo').textContent = `Modification du SLOT ${selectedSlot}`;

    async function loadCharacter() {
        const saveMsg = document.getElementById('saveMsg');

        try {
            const res = await fetch('http://localhost:3000/api/player/me', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            const data = await res.json();

            if (!data.success || !Array.isArray(data.players)) {
                saveMsg.style.color = '#f87171';
                saveMsg.textContent = 'Impossible de charger les personnages';
                return;
            }

            const player = data.players.find(p => Number(p.slot) === selectedSlot);

            if (!player) {
                saveMsg.style.color = '#f87171';
                saveMsg.textContent = 'Aucun personnage trouvé sur ce slot';
                return;
            }

            currentPlayerId = player.id;
            document.getElementById('firstname').value = player.firstname || '';
            document.getElementById('lastname').value = player.name || '';
            document.getElementById('SexSelect').value = player.sexe || 'Autre';
            document.getElementById('currentCharacterLabel').textContent = `${player.firstname} ${player.name} — SLOT ${selectedSlot}`;
        } catch (err) {
            console.error(err);
            saveMsg.style.color = '#f87171';
            saveMsg.textContent = 'Impossible de contacter le serveur';
        }
    }

    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const firstname = document.getElementById('firstname').value.trim();
        const name = document.getElementById('lastname').value.trim();
        const sexe = document.getElementById('SexSelect').value;
        const saveMsg = document.getElementById('saveMsg');

        if (!firstname || !name || !sexe) {
            saveMsg.style.color = '#f87171';
            saveMsg.textContent = 'Veuillez remplir tous les champs';
            return;
        }

        if (!currentPlayerId) {
            saveMsg.style.color = '#f87171';
            saveMsg.textContent = 'Impossible d’identifier le personnage';
            return;
        }

        try {
            const res = await fetch(`http://localhost:3000/api/player/${currentPlayerId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ firstname, name, sexe })
            });

            const data = await res.json();

            if (data.success) {
                saveMsg.style.color = '#4ade80';
                saveMsg.textContent = '✅ Modifications enregistrées avec succès';
                setTimeout(() => {
                    window.location.href = 'character_save.html';
                }, 1000);
            } else {
                saveMsg.style.color = '#f87171';
                saveMsg.textContent = data.message || 'Erreur lors de la sauvegarde';
            }
        } catch (err) {
            console.error(err);
            saveMsg.style.color = '#f87171';
            saveMsg.textContent = 'Impossible de contacter le serveur';
        }
    });

    function confirmDelete() {
        if (confirm('⚠️ Êtes-vous sûr de vouloir supprimer ce personnage ? Cette action est irréversible !')) {
            deleteCharacter();
        }
    }

    async function deleteCharacter() {
        const saveMsg = document.getElementById('saveMsg');

        if (!currentPlayerId) {
            saveMsg.style.color = '#f87171';
            saveMsg.textContent = 'Impossible d’identifier le personnage';
            return;
        }

        try {
            const res = await fetch(`http://localhost:3000/api/player/${currentPlayerId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            const data = await res.json();

            if (data.success) {
                localStorage.removeItem('selectedSlot');
                window.location.href = 'character_save.html';
            } else {
                saveMsg.style.color = '#f87171';
                saveMsg.textContent = data.message || 'Suppression impossible';
            }
        } catch (err) {
            console.error(err);
            saveMsg.style.color = '#f87171';
            saveMsg.textContent = 'Impossible de contacter le serveur';
        }
    }

    loadCharacter();
</script>
</body>
</html>
